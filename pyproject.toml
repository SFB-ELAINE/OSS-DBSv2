[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ossdbs"
dynamic = ["version"]
description = "OSS-DBS v2: faster and modular open-source code for deep brain stimulation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"] 
authors = [{ name = "Julius Zimmermann", email = "julius.zimmermann@uni-rostock.de" },
           { name = "Jan Philipp Payonk", email = "jan.payonk@uni-rostock.de" },
           { name = "Tom Reincke", email = "tom.reincke@uni-rostock.de"},
           { name = "Johannes Reding", email = "johannes.reding@uni-rostock.de"},
     	   { name = "Konstantin Butenko", email = "kbutenko@bwh.harvard.edu"},
     	   { name = "Shruthi Chakravarthy", email = "shruthi.chakravarthy@uni-rostock.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]

dependencies = ["h5py==3.14.0",
                "ngsolve==6.2.2601",
                "nibabel==5.2.1",
                "pandas",
                "scipy",
		"matplotlib",
		# always install NEURON under Linux and Mac
		# windows has no automated installer
		"neuron==8.2.7; platform_system=='Linux'", 
		"neuron==8.2.7; platform_system=='Darwin'", 
		"dipy>=1.8.0",
		"mkl<2026; platform_system!='Darwin'",
                ]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-mock", "pyyaml"]

impedance = ["impedancefitter>=2.0.11"]

dev = [
    "ruff",
    "pre-commit",
]

doc = ["sphinx==6.1.3",
       "sphinx-rtd-theme==1.2.0"]

all = ["ossdbs[test,dev,doc,impedance]"]

[project.urls]
homepage = "https://oss-dbsv2.readthedocs.io/en/latest/"
repository = "https://github.com/SFB-ELAINE/oss-dbsv2"

[project.scripts]
ossdbs =  'ossdbs.main:main'
leaddbs2ossdbs = 'leaddbsinterface.convert_input_dictionary:main'
prepareaxonmodel = 'leaddbsinterface.allocate_axons:main'
run_pathway_activation = 'ossdbs.axon_processing.main:main'

[tool.setuptools]
packages = ["ossdbs", "leaddbsinterface"]
# packages = ["ossdbs", "ossdbs.testing", "leaddbsinterface"]

[tool.setuptools_scm]
version_file = "ossdbs/_version.py"

[tool.ruff]
line-length = 88
target-version = "py310"
lint.select = [
    "E", # style errors
    "W", # style warnings
    "F", # flakes
    "D", # pydocstyle
    "I", # isort
    "U", # pyupgrade
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    # --- rule sets reviewed and adopted with the ruff 0.16 upgrade ---
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "FLY",   # flynt
    "FURB",  # refurb
    "PERF",  # perflint
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "TRY",   # tryceratops
    "BLE",   # flake8-blind-except
    "PLE",   # pylint errors
    "DTZ",   # flake8-datetimez
    "ASYNC", # flake8-async
    "YTT",   # flake8-2020
    "FA",    # flake8-future-annotations
    "TC",    # flake8-type-checking
    "INT",   # flake8-gettext
    "PGH",   # pygrep-hooks
    "EXE",   # flake8-executable
    # curated pylint refactor/warning rules (family selected piecemeal to
    # avoid the noisy PLR2004/PLR09xx/PLC0415 rules)
    "PLC0206",
    "PLR0402",
    "PLR1704",
    "PLR1711",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "PLW0603",
    "PLW1510",
    "PLW1641",
    "PLW2901",
]

lint.extend-ignore = [
    "D100", # Missing docstring in public module
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D401", # First line should be in imperative mood
    "D413", # Missing blank line after last section
    "D416", # Section name should end with a colon
    "TRY003", # Avoid specifying long messages outside the exception class
    "G004",   # Logging statement uses f-string (accepted in this project)
]

[tool.ruff.format]
# Format Python code embedded in docstrings (and Markdown code blocks,
# see the ruff-format pre-commit hook which also runs on *.md).
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "S",
    "E501",
    "BLE001", # broad `except Exception` is common/acceptable in test helpers
    "PT011",  # broad `pytest.raises(...)` without match (opt-in follow-up)
]
"setup.py" = ["D"]
# Examples and helper scripts are illustrative / not shipped: keep them on the
# original rule set instead of the stricter sets adopted for the library.
"examples/**" = [
    "SIM",
    "RET",
    "PIE",
    "FLY",
    "FURB",
    "PERF",
    "PT",
    "LOG",
    "G",
    "TRY",
    "BLE",
    "PLC",
    "PLR",
    "PLW",
    "PLE",
    "PGH",
    "EXE",
]
"input_test_cases/**" = [
    "SIM",
    "RET",
    "PIE",
    "FLY",
    "FURB",
    "PERF",
    "PT",
    "LOG",
    "G",
    "TRY",
    "BLE",
    "PLC",
    "PLR",
    "PLW",
    "PLE",
    "PGH",
    "EXE",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "except PackageNotFoundError:",
]

[tool.coverage.run]
source = ["ossdbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers for test categorization
markers = [
    "simulation: marks tests as full simulation tests (run on PR only, deselect with '-m not simulation')",
    "slow: marks tests as slow-running (> 1 minute)",
    "requires_neuron: marks tests that require NEURON installation",
    "vta: marks VTA-related tests",
    "pam: marks Pathway Activation Modeling tests",
    "floating: marks floating contact tests",
    "surface_impedance: marks surface impedance tests",
]
# By default, exclude simulation tests from regular pytest runs
# They are only run on PR via separate CI workflow
addopts = "-m 'not simulation'"

# Files that should not be in the release
[tool.check-manifest]
ignore = [
    ".gitignore",
    ".gitlab-ci.yml",
    ".pre-commit-config.yaml",
    ".readthedocs.yaml",
    ".ruff_cache/**/*",
    "setup.py",
    "tests/**/*",
    "examples/**/*",
    "input_files/**/*",
    "input_test_cases/**/*",
    "ossdbs/_version.py"  # auto-generated, not in VCS
]
