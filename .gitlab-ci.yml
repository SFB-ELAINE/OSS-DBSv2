# OSS-DBS is tested for Python >= 3.10 (see requires-python in pyproject.toml).
# Dependencies are installed with uv (https://docs.astral.sh/uv/); the
# ghcr.io/astral-sh/uv images ship uv together with the requested Python.

stages:
    - "test"
    - "run"
    - "pages"

.test:
  script:
    - uv pip install --system ".[test]"
    - pytest

.run:
  script:
   - uv pip install --system "."
   - cd input_files
   - ossdbs 'inputTest.json'
   - ossdbs 'input_cc.json'

test-3.10:
   extends: ".test"
   stage: "test"
   variables:
           PYTHONVERSION: "py310"
   image: "ghcr.io/astral-sh/uv:python3.10-bookworm-slim"

run-3.10:
   extends: ".run"
   stage: "run"
   image: "ghcr.io/astral-sh/uv:python3.10-bookworm-slim"

test-3.11:
   extends: ".test"
   stage: "test"
   variables:
           PYTHONVERSION: "py311"
   image: "ghcr.io/astral-sh/uv:python3.11-bookworm-slim"

run-3.11:
   extends: ".run"
   stage: "run"
   image: "ghcr.io/astral-sh/uv:python3.11-bookworm-slim"

test-3.12:
   extends: ".test"
   stage: "test"
   variables:
           PYTHONVERSION: "py312"
   image: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"

run-3.12:
   extends: ".run"
   stage: "run"
   image: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"

pages:
  stage: "pages"
  image: "ghcr.io/astral-sh/uv:python3.10-bookworm-slim"
  script:
    - uv pip install --system "."
    - cd docs
    - uv pip install --system -r requirements.txt
    # in future also include jupyter notebooks
    - make html
    - mv _build/html/ ../public/
  artifacts:
    paths:
      - public
  only:
      - main
