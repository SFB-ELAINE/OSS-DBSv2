name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    # run every week (for --pre release tests)
    - cron: "0 0 * * 0"

jobs:
  check-manifest:
    # check-manifest is a tool that checks that all files in version control are
    # included in the sdist (unless explicitly excluded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx check-manifest

  lock-check:
    # Ensure uv.lock stays in sync with pyproject.toml. The lockfile pins the
    # full transitive dependency graph and is what makes the PyInstaller bundle
    # reproducible (see build_merged.py / docs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        # On PRs/pushes, install straight from the committed lockfile
        # (`--locked`) so the exact pinned graph is what gets tested. On the
        # weekly scheduled run, resolve fresh (ignoring the lock) and allow
        # pre-releases to catch upstream breakage early.
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv sync --python "${{ matrix.python-version }}" --extra test --upgrade --prerelease allow
          else
            uv sync --python "${{ matrix.python-version }}" --extra test --locked
          fi

      - name: 🧪 Run Tests
        # --no-sync: use the environment installed above verbatim (don't let
        # `uv run` re-sync it back to the lockfile on the scheduled run).
        run: uv run --no-sync pytest --color=yes --cov --cov-report=xml --cov-report=term-missing

      - name: Coverage
        uses: codecov/codecov-action@v5

  locked-install-intel-mac:
    # Guard against the lockfile regressing on Intel macOS (x86_64), where some
    # dependencies (e.g. openturns) ship no x86_64-macOS wheel for the newest
    # version. Installs the full impedance stack straight from the lockfile.
    name: Locked install (Intel macOS)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install from lockfile (incl. impedance)
        run: uv sync --locked --extra test --extra impedance
      - name: Smoke-import and run unit tests
        run: |
          uv run --no-sync python -c "import ossdbs, openturns; print('openturns', openturns.__version__)"
          uv run --no-sync pytest --color=yes

  deploy:
    name: Release
    needs: [test, lock-check, check-manifest]
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
